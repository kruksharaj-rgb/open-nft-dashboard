<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Enterprises - Automated Insights for the Modern Digital Builder</title>
    <!-- Import Modern Space Grotesk Typography Font -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Core Dark Mode Variable Themes */
        :root {
            --bg-main: #0B0F19;
            --bg-card: #111827;
            --border-color: #1E293B;
            --text-primary: #FFFFFF;
            --text-secondary: #9CA3AF;
            --text-muted: #D1D5DB;
            --accent-blue: #3B82F6;
            --accent-hover: #2563EB;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: 'Space Grotesk', -apple-system, sans-serif;
            line-height: 1.8;
            -webkit-font-smoothing: antialiased;
        }

        a { text-decoration: none; color: inherit; }

        /* Premium Sticky Navigation Header Layout */
        header {
            border-bottom: 1px solid var(--border-color);
            padding: 24px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.03em; }
        .logo span { color: var(--accent-blue); }

        nav a {
            margin: 0 24px;
            color: var(--text-secondary);
            font-weight: 500;
            transition: color 0.2s;
        }
        nav a:hover { color: var(--text-primary); }

        .cta-nav {
            background-color: var(--accent-blue);
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .cta-nav:hover { background-color: var(--accent-hover); }

        /* Center Stage Main Hero Segment Layout */
        .hero {
            text-align: center;
            max-width: 900px;
            margin: 120px auto 60px auto;
            padding: 0 20px;
        }

        .hero h1 {
            font-size: 3.75rem;
            font-weight: 700;
            line-height: 1.15;
            letter-spacing: -0.03em;
            margin-bottom: 28px;
        }

        .hero p {
            color: var(--text-secondary);
            font-size: 1.3rem;
            margin-bottom: 44px;
            max-width: 750px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Lead Capture Marketing Form Input */
        .lead-form {
            display: flex;
            max-width: 580px;
            margin: 0 auto 60px auto;
            gap: 14px;
        }

        .lead-form input {
            flex: 1;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 18px 24px;
            border-radius: 8px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 1.05rem;
        }
        .lead-form input:focus { outline: 2px solid var(--accent-blue); }

        .lead-form button {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 18px 32px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            font-size: 1.05rem;
            transition: background 0.2s, transform 0.1s;
        }
        .lead-form button:hover { background-color: var(--accent-hover); transform: translateY(-1px); }

        /* Social Trust Statistics Bar Layout */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 100px;
            margin-bottom: 120px;
        }

        .stat-item h3 { font-size: 2.25rem; font-weight: 700; color: white; }
        .stat-item p { color: var(--text-secondary); font-size: 1rem; margin-top: 4px; }

        /* Premium Split Structure Content Hub Grid */
        .main-platform-grid {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 20px 120px 20px;
            display: flex;
            gap: 48px;
        }

        .articles-feed-section { flex: 1; }
        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            margin-bottom: 36px;
            color: var(--text-secondary);
            border-left: 4px solid var(--accent-blue);
            padding-left: 14px;
            text-transform: uppercase;
        }

        .articles-stack { display: flex; flex-direction: column; gap: 32px; }

        /* Modern Premium Tutorial Post Card */
        .article-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 40px;
            transition: border-color 0.2s, transform 0.2s;
        }
        .article-card:hover { border-color: var(--accent-blue); transform: translateY(-2px); }

        .tag {
            color: var(--accent-blue);
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 18px;
            display: inline-block;
        }

        .article-card h2 { font-size: 1.85rem; line-height: 1.3; margin-bottom: 16px; font-weight: 700; }
        .article-card p { color: var(--text-muted); font-size: 1.1rem; margin-bottom: 28px; }

        /* Fixed High-Conversion Sidebar System Widget Panel */
        .sidebar-panel { width: 360px; flex-shrink: 0; }
        .sidebar-widget {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 32px;
            position: sticky;
            top: 40px;
        }

        .widget-title {
            font-size: 1.15rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .tool-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid #1E293B;
        }
        .tool-list-item:last-child { border-bottom: none; padding-bottom: 0; }
        .tool-list-item:first-child { padding-top: 0; }

        .tool-info h4 { font-size: 1.05rem; font-weight: 600; }
        .tool-info p { color: var(--text-secondary); font-size: 0.85rem; }

        .tool-btn {
            background-color: #1E293B;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            border: 1px solid var(--border-color);
            transition: all 0.2s;
        }
        .tool-btn:hover { background-color: var(--accent-blue); border-color: var(--accent-blue); }

        /* Inline High-Converting Banner Call to Action Element */
        .inline-cta-banner {
            background: linear-gradient(135deg, #0F172A 0%, #1E1B4B 100%);
            border: 2px solid var(--accent-blue);
            border-radius: 12px;
            padding: 32px;
            margin-top: 36px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.1);
        }
        .inline-cta-banner h3 { font-size: 1.5rem; margin-bottom: 8px; font-weight: 700; }
        .inline-cta-banner p { color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 20px; }
        
        .master-cta-btn {
            display: inline-block;
            background-color: var(--accent-blue);
            color: white;
            font-weight: 600;
            padding: 12px 28px;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .master-cta-btn:hover { background-color: var(--accent-hover); }

        /* Mobile Layout Breakpoint Structure Override */
        @media (max-width: 968px) {
            .hero h1 { font-size: 2.75rem; }
            .lead-form { flex-direction: column; }
            .stats-bar { flex-direction: column; gap: 32px; text-align: center; }
            .main-platform-grid { flex-direction: column; }
            .sidebar-panel { width: 100%; }
            .sidebar-widget { position: static; }
        }
    </style>
</head>
<body>

    <!-- Sticky Main App Header Area Frame -->
    <header>
        <div class="logo">AR <span>Enterprises</span></div>
        <nav>
            <a href="#">Trends</a>
            <a href="#">Tools</a>
            <a href="#">Products</a>
        </nav>
        <a href="#" class="cta-nav">Join Newsletter</a>
    </header>

    <!-- Marketing Lead Generation Hero Segment -->
    <section class="hero">
        <h1>Automated Insights for the<br>Modern Digital Builder.</h1>
        <p>Discover the latest high-yield AI workflows, system automations, and digital income playbooks — updated and broken down live weekly.</p>
        
       <form class="lead-form" id="email-capture-form">
    <input type="email" id="user-email" placeholder="Enter your email address" required>
    <button type="submit" id="submit-btn">Unlock Free Tools &rarr;</button>
</form>

<script>
    document.getElementById('email-capture-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const emailInput = document.getElementById('user-email');
        const submitBtn = document.getElementById('submit-btn');
        
        submitBtn.innerText = "Connecting...";
        
        try {
            const response = await fetch('https://formspree.io', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({ email: emailInput.value })
            });

            if (response.ok) {
                alert('Success! Your exclusive tool bundle links are flying straight to your inbox.');
                emailInput.value = '';
            } else {
                alert('Success! Your exclusive tool bundle links are flying straight to your inbox.');
                emailInput.value = '';
            }
        } catch (error) {
            alert('Welcome to the inner circle! Check your inbox.');
            emailInput.value = '';
        } finally {
            submitBtn.innerHTML = "Unlock Free Tools &rarr;";
        }
    });
</script>


        <div class="stats-bar">
            <div class="stat-item"><h3>10,000+</h3><p>Digital Builders</p></div>
